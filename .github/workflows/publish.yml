on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch: {}

name: deploy-sporecal-website

jobs:
  # Job para construir o site Quarto/Shinylive
  build: 
    runs-on: ubuntu-latest
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4

      - name: "Setup pandoc"
        uses: r-lib/actions/setup-pandoc@v2

      - name: "Setup R"
        uses: r-lib/actions/setup-r@v2

      # Utilizando o setup-renv para evitar o erro de cache do 'pak' e Bioconductor
      - name: "Setup R dependencies using renv"
        uses: r-lib/actions/setup-renv@v2

      - name: "Set up Quarto"
        uses: quarto-dev/quarto-actions/setup@v2

      - name: "Render working directory"
        uses: quarto-dev/quarto-actions/render@v2

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  # Job para fazer o deploy no GitHub Pages
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4